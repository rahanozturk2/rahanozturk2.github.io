<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rahan Öztürk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#050810; --fg:#e8edf5; --mute:#8a96a8; --line:#1e2c4a; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif;
         display:grid; place-items:center; padding:24px; }
  main { width:100%; max-width:560px; }
  .eyebrow { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); }
  h1 { font-family:"Chakra Petch",sans-serif; font-weight:500; font-size:clamp(36px,8vw,56px);
       letter-spacing:.02em; margin:12px 0 40px; }
  .label { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute);
           border-top:1px solid var(--line); padding-top:20px; margin-bottom:4px; }
  a.work { display:flex; justify-content:space-between; align-items:baseline; gap:16px;
           padding:16px 0; border-bottom:1px solid var(--line); color:var(--fg); text-decoration:none; }
  a.work strong { font-family:"Chakra Petch",sans-serif; font-weight:500; font-size:20px; letter-spacing:.04em; }
  a.work span { color:var(--mute); font-size:14px; transition:color .15s; }
  a.work:hover span { color:var(--fg); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Hoş geldiniz</p>
  <h1>Rahan Öztürk</h1>
  <p class="label">Yaptığım işler</p>
  <a class="work" href="/deltav/"><strong>DELTAV</strong><span>Kurumsal web sitesi →</span></a>
</main>
</body>
</html>
